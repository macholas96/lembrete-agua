name: Compilar e publicar

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Versão do compilador
        run: xcrun swiftc --version

      - name: Conferir que a tag bate com o arquivo VERSION
        if: startsWith(github.ref, 'refs/tags/v')
        run: test "v$(tr -d '[:space:]' < VERSION)" = "$GITHUB_REF_NAME"

      - name: Compilar (Apple Silicon + Intel)
        env:
          UNIVERSAL: "1"
          REPO: ${{ github.repository }}
        run: bash build.sh "$PWD/dist/LembreteAgua.app"

      - name: Empacotar zip (usado pelo botão Atualizar)
        run: ditto -c -k --keepParent dist/LembreteAgua.app dist/LembreteAgua.zip

      - name: "Criar DMG (instalação: arrastar para Aplicativos)"
        run: bash scripts/criar-dmg.sh dist/LembreteAgua.app dist/LembreteAgua.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: LembreteAgua
          path: |
            dist/LembreteAgua.dmg
            dist/LembreteAgua.zip

      - name: Publicar release (quando o número em VERSION é novo)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="v$(tr -d '[:space:]' < VERSION)"
          if gh release view "$V" >/dev/null 2>&1; then
            echo "A release $V já existe — nada a publicar."
            exit 0
          fi
          awk 'NR==1{next} /^Versão /{exit} {print}' NOVIDADES.md > notas.md
          gh release create "$V" dist/LembreteAgua.dmg dist/LembreteAgua.zip \
            --target "$GITHUB_SHA" --title "LembreteAgua ${V#v}" --notes-file notas.md
